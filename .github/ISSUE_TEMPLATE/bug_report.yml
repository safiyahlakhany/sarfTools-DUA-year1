name: Report a bug
description: Tell us when a class resource or website feature is not working correctly.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve the class website. Please do not include passwords or private information.
  - type: input
    id: page
    attributes:
      label: Page or resource
      description: Which page or weekly resource has the problem?
      placeholder: Week 2 Study Tool
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone with Safari

