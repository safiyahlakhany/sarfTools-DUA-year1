name: Request a feature
description: Suggest an improvement for the class website or resource workflow.
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting an improvement. Please do not include passwords or private information.
  - type: textarea
    id: request
    attributes:
      label: What would you like to add or improve?
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: How would this help students or the teacher?

