<script>
(function(){
/* ===== Engine: sound (ṣaḥīḥ) verbs, Forms I–X; اسم الفاعل / اسم المفعول ===== */
const FA='َ',DA='ُ',KA='ِ',SU='ْ',SH='ّ',FT='ً',DT='ٌ',KT='ٍ';
const SEEG={1:['gh','m','w'],2:['gh','m','t'],3:['gh','m','j'],4:['gh','f','w'],5:['gh','f','t'],6:['gh','f','j'],
  7:['ha','m','w'],8:['ha','m','t'],9:['ha','m','j'],10:['ha','f','w'],11:['ha','f','t'],12:['ha','f','j'],13:['mu','mf','w'],14:['mu','mf','tj']};
const PREFIX={1:'ي',2:'ي',3:'ي',4:'ت',5:'ت',6:'ي',7:'ت',8:'ت',9:'ت',10:'ت',11:'ت',12:'ت',13:'أ',14:'ن'};
const PAST_END={1:FA,2:FA+'ا',3:DA+'وْا',4:FA+'تْ',5:FA+'تَا',6:SU+'نَ',7:SU+'تَ',8:SU+'تُمَا',9:SU+'تُمْ',10:SU+'تِ',11:SU+'تُمَا',12:SU+'تُنَّ',13:SU+'تُ',14:SU+'نَا'};
const VOWEL_PAST=new Set([1,2,3,4,5]),NO_SUFFIX=new Set([1,4,7,13,14]);
const PRES_END={
  r:{1:DA,2:FA+'انِ',3:DA+'وْنَ',4:DA,5:FA+'انِ',6:SU+'نَ',7:DA,8:FA+'انِ',9:DA+'وْنَ',10:KA+'يْنَ',11:FA+'انِ',12:SU+'نَ',13:DA,14:DA},
  n:{1:FA,2:FA+'ا',3:DA+'وْا',4:FA,5:FA+'ا',6:SU+'نَ',7:FA,8:FA+'ا',9:DA+'وْا',10:KA+'يْ',11:FA+'ا',12:SU+'نَ',13:FA,14:FA},
  j:{1:SU,2:FA+'ا',3:DA+'وْا',4:SU,5:FA+'ا',6:SU+'نَ',7:SU,8:FA+'ا',9:DA+'وْا',10:KA+'يْ',11:FA+'ا',12:SU+'نَ',13:SU,14:SU}};
const VW={u:DA,i:KA,a:FA};
function past(v,s,voice){
  const [a,b,c]=[...v.root],f=v.form;
  if(voice==='mj'&&!v.tr)return [];
  if(f==='IX'){if(voice==='mj')return [];const st='اِ'+a+SU+b+FA;return [VOWEL_PAST.has(s)?st+c+SH+PAST_END[s]:st+c+FA+c+PAST_END[s]];}
  let st;
  if(voice==='mm')st={I:()=>a+FA+b+VW[v.pv]+c,II:()=>a+FA+b+SH+FA+c,III:()=>a+FA+'ا'+b+FA+c,IV:()=>'أَ'+a+SU+b+FA+c,V:()=>'تَ'+a+FA+b+SH+FA+c,
    VI:()=>'تَ'+a+FA+'ا'+b+FA+c,VII:()=>'اِنْ'+a+FA+b+FA+c,VIII:()=>'اِ'+a+SU+'تَ'+b+FA+c,X:()=>'اِسْتَ'+a+SU+b+FA+c}[f]();
  else st={I:()=>a+DA+b+KA+c,II:()=>a+DA+b+SH+KA+c,III:()=>a+DA+'وْ'+b+KA+c,IV:()=>'أُ'+a+SU+b+KA+c,V:()=>'تُ'+a+DA+b+SH+KA+c,
    VI:()=>'تُ'+a+DA+'وْ'+b+KA+c,VIII:()=>'اُ'+a+SU+'تُ'+b+KA+c,X:()=>'اُسْتُ'+a+SU+b+KA+c}[f]();
  return [st+PAST_END[s]];
}
function presStem(v,voice){
  const [a,b,c]=[...v.root],f=v.form,mj=voice==='mj',k=mj?FA:KA;
  return {I:()=>a+SU+b+(mj?FA:VW[v.rv])+c,II:()=>a+FA+b+SH+k+c,III:()=>a+FA+'ا'+b+k+c,IV:()=>a+SU+b+k+c,V:()=>'تَ'+a+FA+b+SH+FA+c,
    VI:()=>'تَ'+a+FA+'ا'+b+FA+c,VII:()=>'نْ'+a+FA+b+k+c,VIII:()=>a+SU+'تَ'+b+k+c,X:()=>'سْتَ'+a+SU+b+k+c}[f]();
}
const presPrefix=(v,s,voice)=>PREFIX[s]+((voice==='mj'||['II','III','IV'].includes(v.form))?DA:FA);
function ixTail(c,st,s){
  if(s===6||s===12)return [c+KA+c+SU+'نَ'];
  if(NO_SUFFIX.has(s))return {r:[c+SH+DA],n:[c+SH+FA],j:[c+SH+FA,c+SH+KA,c+KA+c+SU]}[st];
  return [c+SH+PRES_END[st][s]];
}
function present(v,s,voice,st){
  if(voice==='mj'&&!v.tr)return [];
  if(v.form==='IX'){if(voice==='mj')return [];const [a,b,c]=[...v.root];return ixTail(c,st,s).map(t=>PREFIX[s]+FA+a+SU+b+FA+t);}
  return [presPrefix(v,s,voice)+presStem(v,voice)+PRES_END[st][s]];
}
function amr2(v,s){
  const [a,b,c]=[...v.root],f=v.form;
  if(f==='IX')return ixTail(c,'j',s).map(t=>'اِ'+a+SU+b+FA+t);
  const stem=presStem(v,'mm')+PRES_END.j[s];
  if(f==='I')return [(v.rv==='u'?'اُ':'اِ')+stem];
  if(f==='IV')return ['أَ'+stem];
  if(['VII','VIII','X'].includes(f))return ['اِ'+stem];
  return [stem];
}
const NEND={wm:{r:DT,n:FT+'ا',j:KT},wf:{r:FA+'ةٌ',n:FA+'ةً',j:FA+'ةٍ'},tm:{r:FA+'انِ',n:FA+'يْنِ',j:FA+'يْنِ'},tf:{r:FA+'تَانِ',n:FA+'تَيْنِ',j:FA+'تَيْنِ'},
  jm:{r:DA+'وْنَ',n:KA+'يْنَ',j:KA+'يْنَ'},jf:{r:FA+'اتٌ',n:FA+'اتٍ',j:FA+'اتٍ'}};
function nounStem(v,nt){
  const [a,b,c]=[...v.root],f=v.form;
  if(nt==='mf'&&(!v.tr||f==='VII'||f==='IX'))return null;
  if(f==='I'&&nt==='fa'&&v.pv==='u')return null;
  if(f==='IX')return 'مُ'+a+SU+b+FA+c+SH;
  const k=nt==='fa'?KA:FA;
  if(f==='I')return nt==='fa'?a+FA+'ا'+b+KA+c:'مَ'+a+SU+b+DA+'وْ'+c;
  return {II:'مُ'+a+FA+b+SH+k+c,III:'مُ'+a+FA+'ا'+b+k+c,IV:'مُ'+a+SU+b+k+c,V:'مُتَ'+a+FA+b+SH+k+c,VI:'مُتَ'+a+FA+'ا'+b+k+c,
    VII:'مُنْ'+a+FA+b+k+c,VIII:'مُ'+a+SU+'تَ'+b+k+c,X:'مُسْتَ'+a+SU+b+k+c}[f]||null;
}
function noun(v,nt,num,gen,st){const s=nounStem(v,nt);return s===null?null:s+NEND[num+gen][st];}
function norm(w){return w.normalize('NFC').replace(/ـ/g,'').replace(/([ً-ِْ])ّ/g,'ّ$1').replace(/\s+/g,' ').trim();}
/* constructions: every verb phrase the exam uses. cons keys match the exam builder. */
const CONS=['past','ma_past','pres','la_pres','ma_pres','an','lan','lam','in','nahy','lamr','amr'];
function build(v,cons,voice,s){
  switch(cons){
    case 'past':return past(v,s,voice);
    case 'ma_past':return past(v,s,voice).map(t=>'مَا '+t);
    case 'pres':return present(v,s,voice,'r');
    case 'la_pres':return present(v,s,voice,'r').map(t=>'لَا '+t);
    case 'ma_pres':return present(v,s,voice,'r').map(t=>'مَا '+t);
    case 'an':return present(v,s,voice,'n').map(t=>'أَنْ '+t);
    case 'lan':return present(v,s,voice,'n').map(t=>'لَنْ '+t);
    case 'lam':return present(v,s,voice,'j').map(t=>'لَمْ '+t);
    case 'in':return present(v,s,voice,'j').map(t=>'إِنْ '+t);
    case 'nahy':return present(v,s,voice,'j').map(t=>'لَا '+t);
    case 'lamr':return (voice==='mm'&&s>=7&&s<=12)?[]:present(v,s,voice,'j').map(t=>'لِ'+t);
    case 'amr':return (voice==='mm'&&s>=7&&s<=12)?amr2(v,s):[];
  }
}
const CONS_AN={past:['madi',false,'none'],ma_past:['madi',true,'none'],pres:['mud',false,'r'],la_pres:['mud',true,'r'],ma_pres:['mud',true,'r'],
  an:['mud',false,'n'],lan:['mud',true,'n'],lam:['mud',true,'j'],in:['mud',false,'j'],nahy:['nahy',true,'j'],lamr:['amr',false,'j'],amr:['amr',false,'j']};
function babOf(v){return v.form;}
let VIDX=null,NIDX=null;
function buildIndex(bank){
  VIDX=new Map();NIDX=new Map();
  for(const v of bank){
    for(const voice of ['mm','mj'])for(let s=1;s<=14;s++)for(const c of CONS)for(const w of build(v,c,voice,s)){

function p2Elements(it,typed){

  if(it.answers.some(a=>canonT(a)===t))return {A:1,B:1,C:1,D:1};
  const acc=P2T[it.tid][1],accStem=new Set(acc.map(STEMT));

  for(const r of rs){
    const v=BV[r.verb];const same=build(v,r.cons,r.voice,it.s).some(w=>canonT(w)===t);
    const e={A:r.verb===it.v?1:0,B:(same||SEEG[r.s].join()===SEEG[it.s].join())?1:0,C:(r.voice===it.voice&&accStem.has(STEMT(r.cons)))?1:0,D:acc.includes(r.cons)?1:0};
    const n=e.A+e.B+e.C+e.D;if(!best||n>best.n)best={...e,n,r};

  if(sameLetters){e.A=1;e.B=1;let cBad=false,dBad=false;
    B.forEach((c,j)=>{if(A[j].m!==c.m){if(j<partLen||j===B.length-1)dBad=true;else cBad=true;}});

  upd(it.kind,g.nounOK?1:0);
  if(it.n!=='w')upd('endings',g.nounOK&&g.ok.num?1:0);
  if(it.s!=='r'||it.n!=='w')upd('states',g.ok.st&&g.nounOK?1:0);
  upd('seegha',(['type','gen','num','st'].filter(k=>g.ok[k]).length)/4);
  S.stats.hist.push({k:it.kind,p:g.pts});if(S.stats.hist.length>400)S.stats.hist.shift();
  S.stats.items++;S.recent.push(it.id);if(S.recent.length>25)S.recent.shift();
  award('first');
  if(g.all){S.streak++;S.best=Math.max(S.best,S.streak);S.xp+=Math.round(10*(S.streak>=10?2:S.streak>=5?1.5:1));if(S.streak===10)award('s10');}
  else{S.streak=0;S.xp+=Math.round(g.pts*8);}
  if(it.mode==='prac'){
    const touched=[it.kind,...(it.n!=='w'?['endings']:[]),'states','seegha'];
    const c=touched.filter(k=>{const s=S.stats.skills[k],l=s.last;return ((s.n>=3&&mastery(s)<.7)||(l.length>=2&&l[l.length-1]<.5&&l[l.length-2]<.5))&&(S.stats.items-(S.lessonAt[k]??-99))>=10;});
    if(c.length&&S.stats.items-S.lastLesson>=4){c.sort((a,b)=>mastery(S.stats.skills[a])-mastery(S.stats.skills[b]));S.pending=c[0];}
  }
  const P=projection();if(P.ready&&!S.readySeen){S.readySeen=true;award('ready');S.showReady=true;}
  if(SKILLS.every(s=>level(S.stats.skills[s.k])==='strong'))award('all');
  S.since++;save();
}

  const rows=MOCK.ans.map((it,i)=>'<tr class="'+(it.res.all?'okr':'nor')+'"><td>'+(i+1)+'<br><small>'+fmt(it.res.pts)+'/1</small></td><td>'+it.prompt+'</td><td>'+(it.res.all?'✓':(it.res.nounOK?'':'<div>'+(it.typed.trim()?AR(it.typed):'—')+' → '+AR(it.ar)+'</div>')+(['type','gen','num','st'].every(k=>it.res.ok[k])?'':'<div>'+AR(seegha(it))+'</div>'))+'</td></tr>').join('');
  return '<main><section class="card"><div class="kick">Mock quiz result</div><div class="big">'+fmt(m.pts)+'/30</div><p class="status">'+(m.pts>=27?'<b class="okc">27/30 or better: ready for the quiz.</b>':'Below 27/30. Your weak areas have been updated.')+' '+m.min+' min.</p>'+
   '<div class="btns"><button class="btn primary" data-go="practice">Continue practice</button><button class="btn" data-go="home">Dashboard</button></div><h3>Review</h3><div class="tw"><table class="lt rev"><tr><th>#</th><th>Question</th><th>Correction</th></tr>'+rows+'</table></div></section></main>';}
/* ---------- events ---------- */
function modal(t,h){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="mbox"><div class="mhead"><b>'+t+'</b><button class="btn sm" id="mclose">Close</button></div>'+h+'</div>';document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.id==='mclose')m.remove();};}
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>showLesson(b.dataset.lesson,false));
  const c=$('#check');if(c)c.onclick=()=>check(false);const i=$('#idk');if(i)i.onclick=()=>check(true);
  const lg=$('#lessonGo');if(lg)lg.onclick=()=>{S.lessons++;S.lessonAt[LESSON.k]=S.stats.items;S.lastLesson=S.stats.items;S.focus={k:LESSON.k,left:3};S.xp+=5;if(S.lessons>=3)award('l3');save();nextItem();};
  if(VIEW==='item'){bindKeyboard();const t=$('#typed');if(t&&!(window.matchMedia&&matchMedia('(pointer:coarse)').matches))t.focus();}
}
function go(w){
  if(w==='charts')return modal('Charts',chartsHTML());
  if(w==='reset'){if(confirm('Reset all progress?')){S=fresh();save();VIEW='home';render();}return;}
  if(w==='home'){if(VIEW==='item'&&CUR.mode==='mock'&&!confirm('Leave the mock quiz? It will not be scored.'))return;VIEW='home';return render();}
  if(w==='mock')return startMock();
  if(w==='practice'){if(VIEW==='item'&&CUR&&!CUR.done&&CUR.mode!=='mock')return;return nextItem();}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&VIEW==='item'&&!e.target.closest('select')&&!document.querySelector('.modal')){e.preventDefault();check(false);}});
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}
function init(){S=load();render();}

init();
window.__q={get S(){return S;},get CUR(){return CUR;},get VIEW(){return VIEW;},get LESSON(){return LESSON;},get MOCK(){return MOCK;},ITEMS,FORMS,grade,projection,LESSONS,SKILLS,canonT,seegha,setRnd:f=>{rnd=f;},mastery};
})();
</script></body></html>
