<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nahy Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe4;--card:#fffdf8;--ink:#1d2621;--muted:#69706a;--line:#e1d7c2;
  --accent:#1f6b4f;--accent-ink:#fff;--gold:#b9842a;--good:#2e7d4f;--good-bg:#e5f2e9;
  --bad:#b3412f;--bad-bg:#f8e6e2;--tile:#ffffff;--chip:#edf3ee;--hot:#fff4d6;--shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px rgba(40,30,10,.07);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121815;--card:#1a221e;--ink:#ece6d8;--muted:#9aa39c;--line:#2e3a33;
    --accent:#5fbf93;--accent-ink:#0e1411;--gold:#e0b25a;--good:#6fcf9b;--good-bg:#1b3327;
    --bad:#e98370;--bad-bg:#3a201b;--tile:#222c27;--chip:#21302a;--hot:#3a3320;--shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;min-height:100vh}
.ar{font-family:Amiri,"Scheherazade New","Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer}
select{font:inherit}

/* HUD */
.hud{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud-in{max-width:880px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{background:none;border:0;padding:0;display:flex;align-items:baseline;gap:8px}
.brand .ar{font-size:24px;font-weight:700;color:var(--accent)}
.brand small{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.hstats{display:flex;gap:14px;margin-inline-start:auto;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:flex-end;min-width:44px}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}
.mult{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--gold);border-radius:999px;padding:1px 6px;margin-inline-start:4px}
.rank{display:flex;flex-direction:column;min-width:120px}
.rank .t{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:600}
.rank .t .ar{font-size:16px;color:var(--gold)}
.bar{height:5px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .5s}

main{max-width:880px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:26px;margin:4px 0 6px;letter-spacing:-.01em}
h1 .ar{font-size:34px;color:var(--accent);font-weight:700}
.lede{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:18px;font-size:14px}
.legend .card{padding:12px 14px}
.legend b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.seccard{display:flex;flex-direction:column;gap:8px}
.seccard .num{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.seccard h3{margin:0;font-size:18px}
.seccard .ar{font-size:22px;color:var(--accent)}
.seccard p{margin:0;font-size:14px;color:var(--muted)}
.seccard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.stars{color:var(--gold);letter-spacing:1px;font-size:18px;white-space:nowrap}
.stars .off{color:var(--line)}
.btn{border:1px solid var(--line);background:var(--tile);border-radius:10px;padding:9px 16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tile:focus-visible,select:focus-visible,.slot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.mini{font-size:13px;color:var(--muted)}

/* question */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:13px;font-weight:600;color:var(--muted)}
.qtop .bar{flex:1;margin:0;height:6px}
.qtop .bar i{background:var(--accent)}
.prompt{text-align:center;padding:6px 0 14px;border-bottom:1px dashed var(--line);margin-bottom:16px}
.rootpair{font-size:24px}
.gloss{font-size:13px;color:var(--muted)}
.seegline{font-size:22px;margin-top:8px;line-height:1.9}
.enprompt{font-size:21px;font-weight:600;margin-top:8px}
.bigar{font-size:56px;line-height:1.5;text-align:center;font-weight:700}
.task{font-size:13px;color:var(--muted);text-align:center;margin:-4px 0 12px}

.buildline{display:flex;align-items:stretch;gap:10px;direction:rtl}
.buildline .la{font-size:34px;align-self:center;color:var(--muted)}
.drop{flex:1;min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;direction:rtl;transition:background .15s,border-color .15s}
.drop.hot{background:var(--hot);border-color:var(--gold)}
.drop:empty::before{content:"Drag or tap letters and ḥarakāt here";direction:ltr;color:var(--muted);font-size:13px;width:100%;text-align:center}
.chip{font-family:Amiri,serif;font-size:28px;min-width:36px;height:46px;border-radius:8px;background:var(--chip);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;padding:0 6px;line-height:1}
.chip.mark{font-size:30px;color:var(--accent)}
.preview{text-align:center;font-size:48px;min-height:80px;margin:10px 0 4px;font-weight:700}
.bank{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.bank .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{touch-action:none;user-select:none;-webkit-user-select:none;border:1px solid var(--line);background:var(--tile);border-radius:10px;min-width:48px;height:52px;padding:0 10px;font-size:28px;box-shadow:0 2px 0 var(--line);transition:transform .08s}
.tile.ar{font-family:Amiri,serif}
.tile.mark{color:var(--accent);font-size:32px}
.tile.en{font-size:15px;font-weight:600;height:44px;font-family:Inter,system-ui,sans-serif}
.tile:active{transform:translateY(1px)}
.tile.used{background:var(--chip);border-color:var(--accent)}
.tile:disabled{opacity:.5;cursor:default}
.tools{display:flex;gap:8px;justify-content:center}
.ghost-drag{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-70%) scale(1.08);opacity:.92;box-shadow:0 10px 24px rgba(0,0,0,.25)}

.seegbuild{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:flex-end;justify-content:center;direction:rtl;font-size:22px}
.seegbuild .fixed{font-family:Amiri,serif;background:var(--chip);border-radius:8px;padding:4px 10px}
.seegbuild .dash{color:var(--muted);padding-bottom:6px}
.seegbuild label{display:flex;flex-direction:column;align-items:center;gap:2px}
.seegbuild label small{direction:ltr;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;font-family:Inter,sans-serif}
.seegbuild select{font-family:Amiri,serif;font-size:21px;direction:rtl;padding:4px 8px;border-radius:8px;border:2px solid var(--line);background:var(--tile);color:var(--ink);min-width:118px}
.seegbuild select.ok{border-color:var(--good)}
.seegbuild select.no{border-color:var(--bad)}

.sentence{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:20px;font-weight:600;margin:6px 0 4px}
.slot{min-width:120px;min-height:46px;border:2px dashed var(--line);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:4px 12px;color:var(--muted);font-weight:500;font-size:15px;background:transparent}
.slot.filled{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--chip);font-weight:600;font-size:18px}
.slot.hot{background:var(--hot);border-color:var(--gold)}

.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:15px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--good-bg);color:var(--ink);border:1px solid var(--good)}
.fb.no{background:var(--bad-bg);color:var(--ink);border:1px solid var(--bad)}
.fb.retry{background:var(--hot);border:1px solid var(--gold)}
.fb .h{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb .ans{font-size:30px;font-family:Amiri,serif}
.fb .ex{margin-top:6px;font-size:14px;color:var(--muted)}
.fb .ex .ar{font-size:19px;color:var(--ink)}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.float{position:fixed;z-index:90;font-weight:800;color:var(--gold);font-size:22px;pointer-events:none;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:toast 2.6s forwards;max-width:calc(100% - 32px);text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:80}

.sum-big{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.sum-grid .card{padding:12px}
.sum-grid b{display:block;font-size:22px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.badge{border:1px solid var(--gold);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.badge.off{border-color:var(--line);color:var(--muted);opacity:.7}
table.rt{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
table.rt td,table.rt th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start}
table.rt th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

@media (max-width:560px){
  .bigar{font-size:44px}.preview{font-size:40px}
  .tile{min-width:42px;height:48px;font-size:25px;padding:0 8px}
  .seegbuild select{min-width:96px;font-size:19px}
  .hstats{gap:10px}.rank{min-width:96px}
  h1{font-size:22px}
}
</style>
</head>
<body>
<header class="hud"><div class="hud-in" id="hud"></div></header>
<main id="app"></main>
<canvas id="fx"></canvas>
<script>
(function(){
'use strict';

/* ---------- Morphology ---------- */
const FA='َ', DA='ُ', KA='ِ', SU='ْ';
const LA='ل'+FA+'ا';
const PER={gh:'غَائِب',ha:'حَاضِر',mu:'مُتَكَلِّم'};
const GEN={m:'مُذَكَّر',f:'مُؤَنَّث',mf:'مُذَكَّر أَو مُؤَنَّث'};
const NUM={w:'وَاحِد',t:'تَثْنِيَة',j:'جَمْع'};
const FIELD_EN={per:'person',g:'gender',n:'number'};
const E_SUK=SU, E_DUAL=FA+'ا', E_PLM=DA+'و'+SU+'ا', E_SF=KA+'ي'+SU, E_PLF=SU+'ن'+FA;
const END_TXT={};
END_TXT[E_SUK]='last radical takes sukūn (jazm)';
END_TXT[E_DUAL]='dual ending — the nūn of the muḍāriʿ is dropped';
END_TXT[E_PLM]='plural ending — nūn dropped, alif added after the wāw';
END_TXT[E_SF]='feminine singular ending — nūn dropped';
END_TXT[E_PLF]='nūn of the feminine plural stays; the radical before it is sākin';

const SEEG=[
 {id:1, p:'ي',per:'gh',g:'m', n:'w',end:E_SUK, en:'He'},
 {id:2, p:'ي',per:'gh',g:'m', n:'t',end:E_DUAL,en:'They (2m)'},
 {id:3, p:'ي',per:'gh',g:'m', n:'j',end:E_PLM, en:'They (3m)'},
 {id:4, p:'ت',per:'gh',g:'f', n:'w',end:E_SUK, en:'She'},
 {id:5, p:'ت',per:'gh',g:'f', n:'t',end:E_DUAL,en:'They (2f)'},
 {id:6, p:'ي',per:'gh',g:'f', n:'j',end:E_PLF, en:'They (3f)'},
 {id:7, p:'ت',per:'ha',g:'m', n:'w',end:E_SUK, en:'You (1m)'},
 {id:8, p:'ت',per:'ha',g:'m', n:'t',end:E_DUAL,en:'You (2m)'},
 {id:9, p:'ت',per:'ha',g:'m', n:'j',end:E_PLM, en:'You (3m)'},
 {id:10,p:'ت',per:'ha',g:'f', n:'w',end:E_SF,  en:'You (1f)'},
 {id:11,p:'ت',per:'ha',g:'f', n:'t',end:E_DUAL,en:'You (2f)'},
 {id:12,p:'ت',per:'ha',g:'f', n:'j',end:E_PLF, en:'You (3f)'},
 {id:13,p:'أ',per:'mu',g:'mf',n:'w',end:E_SUK, en:'I'},
 {id:14,p:'ن',per:'mu',g:'mf',n:'j',end:E_SUK, en:'We'}
];
const SM={}; SEEG.forEach(s=>SM[s.id]=s);

// [root, muḍāriʿ ʿayn vowel, māḍī ʿayn vowel, English, English passive (null = intransitive)]
const VRAW=[
 ['نصر',DA,FA,'help','be helped'],
 ['قتل',DA,FA,'kill','be killed'],
 ['كتب',DA,FA,'write','be written'],
 ['خرج',DA,FA,'exit',null],
 ['دخل',DA,FA,'enter',null],
 ['نظر',DA,FA,'look',null],
 ['أكل',DA,FA,'eat','be eaten'],
 ['كسر',KA,FA,'break','be broken'],
 ['جلس',KA,FA,'sit',null],
 ['ضرب',KA,FA,'hit','be hit'],
 ['غسل',KA,FA,'wash','be washed'],
 ['حمل',KA,FA,'carry','be carried'],
 ['رجع',KA,FA,'return',null],
 ['فتح',FA,FA,'open','be opened'],
 ['قطع',FA,FA,'cut','be cut'],
 ['سأل',FA,FA,'ask','be asked'],
 ['جمع',FA,FA,'gather','be gathered'],
 ['ذهب',FA,FA,'go',null],
 ['سمع',FA,KA,'hear','be heard'],
 ['شرب',FA,KA,'drink','be drunk'],
 ['فهم',FA,KA,'understand','be understood']
];
const VERBS=VRAW.map(([r,v,mv,en,pass],i)=>{
  const [a,b,c]=[...r];
  return {i,r,a,b,c,v,en,pass,madi:a+FA+b+mv+c+FA,mud:'ي'+FA+a+SU+b+v+c+DA};
});

function stem(vb,s){
  if(s.id===13 && vb.a==='أ') return 'آ'+vb.b+vb.v+vb.c+s.end; // أَ + أْ → آ
  return s.p+FA+vb.a+SU+vb.b+vb.v+vb.c+s.end;
}
function full(vb,s){return LA+' '+stem(vb,s);}
// sukūn on a madd letter (ا, و after ḍamma, ي after kasra) is optional
function norm(x){return x.replace(/اْ/g,'ا').replace(/ُوْ/g,'ُو').replace(/ِيْ/g,'ِي');}
function validFor(vb,form){const f=norm(form);return SEEG.filter(s=>norm(stem(vb,s))===f);}
function seegLine(s){return 'الفِعْلُ النَّهْيُ – مَعْرُوف – '+PER[s.per]+' – '+GEN[s.g]+' – '+NUM[s.n]+' – مَنْهِيْ';}
function seegShort(s){return PER[s.per]+' – '+GEN[s.g]+' – '+NUM[s.n];}
const AR=t=>'<span class="ar">'+t+'</span>';
function explain(vb,s){
  const vn={[DA]:'ḍamma',[KA]:'kasra',[FA]:'fatḥa'}[vb.v];
  if(s.id===13 && vb.a==='أ')
    return 'Prefix '+AR('أَ')+' + '+AR('أْ')+' merge into '+AR('آ')+' · ʿayn takes '+vn+' ('+AR(vb.mud)+') · '+END_TXT[s.end];
  return 'Prefix '+AR(s.p+FA)+' · '+AR(vb.a+SU)+' sākin · ʿayn takes '+vn+' ('+AR(vb.mud)+') · '+END_TXT[s.end];
}

/* ---------- Question set ---------- */
const SECS=[
 {n:1,type:'build',count:34,title:'Build the verb',ar:'بِنَاءُ الفِعْلِ',desc:'Drag letters and ḥarakāt into place to form the prohibition from its ṣīgha or its English meaning.'},
 {n:2,type:'id',count:33,title:'Identify the ṣīgha',ar:'تَعْيِينُ الصِّيغَةِ',desc:'Set person, gender and number from the dropdowns.'},
 {n:3,type:'tr',count:33,title:'Translate',ar:'التَّرْجَمَةُ',desc:'Drag the subject and the action into the English sentence.'}
];
const BASE={build:15,id:10,tr:10};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function genSet(seed){
  const rnd=mulberry32(seed);
  const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const qs=[]; let vq=[];
  const all=()=>sh(VERBS.map(v=>v.i));
  const nextVerb=ok=>{if(!vq.length)vq=all();let i=vq.findIndex(ok);if(i<0){vq=vq.concat(all());i=vq.findIndex(ok);}if(i<0)throw new Error('verb pick failed');return vq.splice(i,1)[0];};
  SECS.forEach(sec=>{
    let ids=[]; while(ids.length<sec.count) ids=ids.concat(sh(SEEG.map(s=>s.id)));
    ids=ids.slice(0,sec.count);
    const seen=new Set();
    ids.forEach((sid,k)=>{
      const s=SM[sid];
      const vi=nextVerb(vi=>{
        const vb=VERBS[vi];
        if(sec.type==='build' && sid===13 && vb.a==='أ') return false;
        return !seen.has(norm(full(vb,s)));
      });
      const vb=VERBS[vi]; seen.add(norm(full(vb,s)));
      const q={sec:sec.n,type:sec.type,vi,sid};
      if(sec.type==='build') q.mode=(k%2)?'en':'sg';
      if(sec.type==='tr'){
        const val=validFor(vb,stem(vb,s)).map(x=>x.id);
        const cands=SEEG.filter(x=>!val.includes(x.id)).map(x=>({id:x.id,sc:(x.p===s.p?1:0)+(norm(x.end)===norm(s.end)?1:0)+rnd()*0.9}));
        cands.sort((a,b)=>b.sc-a.sc);
        q.subj=sh(val.concat(cands.slice(0,5).map(c=>c.id)));
        const others=sh(VERBS.filter(v=>v.i!==vi)).slice(0,vb.pass?3:4).map(v=>v.en);
        q.verbs=sh([vb.en].concat(vb.pass?[vb.pass]:[]).concat(others));
      }
      qs.push(q);
    });
  });
  return qs;
}
function maxScore(qs){let st=0,t=0;qs.forEach(q=>{st++;t+=Math.round(BASE[q.type]*multOf(st));});return t;}
function multOf(st){return st>=10?3:st>=6?2:st>=3?1.5:1;}

const RANKS=[{t:0,ar:'مُبْتَدِئ',en:'Beginner'},{t:.15,ar:'طَالِب',en:'Student'},{t:.35,ar:'مُتَعَلِّم',en:'Learner'},{t:.55,ar:'صَرْفِيّ',en:'Ṣarfī'},{t:.75,ar:'أُسْتَاذ',en:'Ustādh'},{t:.9,ar:'عَلَّامَة',en:'ʿAllāma'}];
const BADGES={
  first:{n:'First step',d:'First correct answer'},
  s10:{n:'Ten in a row',d:'10-answer streak'},
  s25:{n:'Twenty-five in a row',d:'25-answer streak'},
  sweep1:{n:'Clean build',d:'Section 1 all correct on first try'},
  sweep2:{n:'Clean ṣīgha',d:'Section 2 all correct on first try'},
  sweep3:{n:'Clean translation',d:'Section 3 all correct on first try'},
  nohint:{n:'No crutches',d:'All 100 without a hint'},
  century:{n:'Century',d:'All 100 answered'}
};

/* ---------- State ---------- */
const KEY='nahy-drill-v1', BEST='nahy-drill-best';
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
let S, QS, MAX;
function fresh(seed){
  S={seed,res:[],score:0,streak:0,bestStreak:0,badges:[],view:'home',cur:-1,sumSec:0,practice:null};
  QS=genSet(seed); MAX=maxScore(QS);
  QS.forEach((q,k)=>S.res[k]={done:false,ok:false,tries:0,pts:0,hint:false});
}
function load(){
  const raw=store.get(KEY);
  if(raw){try{const d=JSON.parse(raw);fresh(d.seed);Object.assign(S,{res:d.res,score:d.score,streak:d.streak,bestStreak:d.bestStreak,badges:d.badges||[]});return;}catch(e){}}
  fresh((Math.random()*2**31)|0);
}
function save(){store.set(KEY,JSON.stringify({seed:S.seed,res:S.res,score:S.score,streak:S.streak,bestStreak:S.bestStreak,badges:S.badges}));}
function best(){return +(store.get(BEST)||0);}

const secIdx=n=>QS.map((q,k)=>k).filter(k=>QS[k].sec===n);
const nextUnanswered=n=>secIdx(n).find(k=>!S.res[k].done);
const secStats=n=>{const ks=secIdx(n);const r=ks.map(k=>S.res[k]);return{total:ks.length,done:r.filter(x=>x.done).length,ok:r.filter(x=>x.ok).length,first:r.filter(x=>x.ok&&x.tries===1).length,pts:r.reduce((a,x)=>a+x.pts,0)};};
const starsFor=st=>{if(st.done<st.total)return -1;const f=st.first/st.total;return f>=.9?3:f>=.7?2:f>=.5?1:0;};
const starHTML=n=>n<0?'':'<span class="stars">'+[0,1,2].map(i=>i<n?'★':'<span class="off">★</span>').join('')+'</span>';
const answered=()=>S.res.filter(r=>r.done).length;
function rankOf(score){let r=RANKS[0];RANKS.forEach(x=>{if(score>=x.t*MAX)r=x;});return r;}

/* ---------- Effects ---------- */
let tq=[],tOn=false;function toast(msg){tq.push(msg);if(!tOn)nextToast();}function nextToast(){const m=tq.shift();if(!m){tOn=false;return;}tOn=true;const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>{t.remove();nextToast();},2600);}
function floatPts(txt,el){const r=el.getBoundingClientRect();const f=document.createElement('div');f.className='float';f.textContent=txt;f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top-6)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1200);}
function confetti(n){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#1f6b4f','#b9842a','#e0b25a','#5fbf93','#b3412f'];
  const P=Array.from({length:n||120},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+3,c:cols[(Math.random()*cols.length)|0],a:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});if(++f<110)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height);})();
}
function award(id){if(S.badges.includes(id))return;S.badges.push(id);toast('Badge earned: '+BADGES[id].n);}

/* ---------- Drag & drop (pointer-based, works with touch) ---------- */
let drag=null;
function zoneAt(x,y){const t=document.elementFromPoint(x,y);return t&&t.closest('[data-zone]');}
function bindTile(el,data,onTap,onDrop){
  el.addEventListener('click',()=>{if(el._dragged){el._dragged=false;return;}if(!el.disabled)onTap();});
  el.addEventListener('pointerdown',e=>{if(el.disabled||e.button>0)return;try{el.setPointerCapture(e.pointerId);}catch(_){}drag={el,sx:e.clientX,sy:e.clientY,moved:false,ghost:null,over:null};});
  el.addEventListener('pointermove',e=>{
    if(!drag||drag.el!==el)return;
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6){drag.moved=true;const g=el.cloneNode(true);g.classList.add('ghost-drag');g.style.width=el.offsetWidth+'px';document.body.appendChild(g);drag.ghost=g;}
    if(drag.moved){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';const z=zoneAt(e.clientX,e.clientY);const okz=z&&z.dataset.zone===data.zone?z:null;if(okz!==drag.over){drag.over&&drag.over.classList.remove('hot');okz&&okz.classList.add('hot');drag.over=okz;}}
  });
  const end=e=>{
    if(!drag||drag.el!==el)return;const d=drag;drag=null;
    if(d.ghost)d.ghost.remove();if(d.over)d.over.classList.remove('hot');
    if(!d.moved)return;el._dragged=true;setTimeout(()=>{el._dragged=false;},50);
    if(e.type==='pointercancel')return;
    const z=zoneAt(e.clientX,e.clientY);if(z&&z.dataset.zone===data.zone)onDrop(z,e.clientX,e.clientY);
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

const $=s=>document.querySelector(s);
const app=$('#app');
let U={}; // per-question UI state

function renderHUD(){
  const r=rankOf(S.score),i=RANKS.indexOf(r),nx=RANKS[i+1];
  const lo=r.t*MAX,hi=nx?nx.t*MAX:MAX;const pct=Math.min(100,hi>lo?((S.score-lo)/(hi-lo))*100:100);
  const m=multOf(S.streak);
  $('#hud').innerHTML=
   '<button class="brand" data-act="home" aria-label="Home"><span class="ar">لَا تَفْعَلْ</span><small>Nahy drill</small></button>'+
   '<div class="hstats">'+
   '<div class="rank" title="'+(nx?Math.ceil(hi-S.score)+' pts to '+nx.en:'Top rank')+'"><div class="t"><span>'+r.en+'</span>'+AR(r.ar)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
   '<div class="stat"><span class="k">Streak</span><b>🔥 '+S.streak+(m>1?'<span class="mult">×'+m+'</span>':'')+'</b></div>'+
   '<div class="stat"><span class="k">Score</span><b>'+S.score+'</b></div>'+
   '<div class="stat"><span class="k">Done</span><b>'+answered()+'/'+QS.length+'</b></div>'+
   '</div>';
  $('#hud [data-act=home]').onclick=()=>go('home');
}
function go(v,arg){
  S.view=v;
  if(v==='q')S.cur=arg;
  if(v==='q'||v==='prac')U={tokens:[],sel:{per:'',g:'',n:''},slot:{subj:null,verb:null},lock:{}};
  if(v==='sum')S.sumSec=arg;
  render();window.scrollTo(0,0);
}
function render(){renderHUD();({home:vHome,q:vQ,sum:vSum,final:vFinal,prac:vQ})[S.view]();}

    '<div class="card"><b>Scoring</b>Build 15 · Ṣīgha 10 · Translate 10.<br>Streak ×1.5 at 3, ×2 at 6, ×3 at 10. Retry or hint = half.</div>'+

  const tf=$('#toFinal');if(tf)tf.onclick=()=>go('final');
  $('#newSet').onclick=()=>{if(answered()&&!confirm('Start a new set of 100? Current progress will be cleared.'))return;store.del(KEY);fresh((Math.random()*2**31)|0);save();go('home');};

function curRec(){return S.view==='prac'?S.practice.rec:S.res[S.cur];}
function curK(){return S.view==='prac'?S.practice.list[S.practice.pos]:S.cur;}

function vQ(){
  const k=curK(),q=QS[k],vb=VERBS[q.vi],s=SM[q.sid],r=curRec(),prac=S.view==='prac';
  const ks=prac?S.practice.list:secIdx(q.sec),pos=prac?S.practice.pos:ks.indexOf(k);
  const sec=SECS[q.sec-1];
  let body='';
  if(q.type==='build'){
    body='<div class="prompt"><div class="rootpair ar">'+vb.madi+' – '+vb.mud+'</div><div class="gloss">to '+vb.en+'</div>'+
      (q.mode==='sg'?'<div class="seegline ar">'+seegLine(s)+'</div>':'<div class="enprompt">'+s.en+' must not '+vb.en+'!</div>')+'</div>'+
      '<div class="task">Build the verb after '+AR('لَا')+'. Each letter, then its ḥaraka.</div>'+
      '<div class="buildline"><span class="la ar">لَا</span><div class="drop" data-zone="ans" id="ans"></div></div>'+
      '<div class="preview ar" id="prev"></div>'+
      '<div class="bank"><div class="tiles" id="letters"></div><div class="tiles" id="marks"></div>'+
      '<div class="tools"><button class="btn ghost" id="undo">⌫ Undo</button><button class="btn ghost" id="clr">Clear</button></div></div>';
  } else if(q.type==='id'){
    const opt=(key,map)=>'<label><small>'+FIELD_EN[key]+'</small><select data-k="'+key+'" aria-label="'+FIELD_EN[key]+'"><option value="">—</option>'+Object.keys(map).map(x=>'<option value="'+x+'">'+map[x]+'</option>').join('')+'</select></label>';
    body='<div class="prompt"><div class="bigar ar">'+full(vb,s)+'</div><div class="gloss ar" style="font-size:18px">'+vb.madi+' – '+vb.mud+'</div></div>'+
      '<div class="task">Complete the ṣīgha.</div>'+
      '<div class="seegbuild"><span class="fixed">الفِعْلُ النَّهْيُ</span><span class="dash">–</span><span class="fixed">مَعْرُوف</span><span class="dash">–</span>'+
      opt('per',PER)+'<span class="dash">–</span>'+opt('g',GEN)+'<span class="dash">–</span>'+opt('n',NUM)+'<span class="dash">–</span><span class="fixed">مَنْهِيْ</span></div>';
  } else {
    body='<div class="prompt"><div class="bigar ar">'+full(vb,s)+'</div></div>'+
      '<div class="task">Drag the subject and the action into the sentence.</div>'+
      '<div class="sentence"><button class="slot" data-zone="subj" id="slot-subj">who?</button><span>must not</span><button class="slot" data-zone="verb" id="slot-verb">do what?</button><span>!</span></div>'+
      '<div class="bank"><div class="lab">Who</div><div class="tiles" id="subjT"></div><div class="lab">Action</div><div class="tiles" id="verbT"></div></div>';
  }
  app.innerHTML=
   '<div class="qtop"><span>'+(prac?'Practice missed':'Section '+q.sec+' · '+sec.title)+'</span><div class="bar"><i style="width:'+((pos)/ks.length*100)+'%"></i></div><span>'+(pos+1)+'/'+ks.length+'</span></div>'+
   '<div class="card" id="qcard">'+body+'<div class="fb" id="fb" aria-live="polite"></div>'+
   '<div class="actions"><button class="btn ghost" id="hintB">Hint (½ points)</button><button class="btn primary" id="checkB">Check</button></div></div>'+
   '<div class="row-btns"><button class="btn ghost" id="backH">← Sections</button></div>';
  $('#backH').onclick=()=>go('home');
  $('#checkB').onclick=check;
  $('#hintB').onclick=hint;
  if(q.type==='build')wireBuild(q,vb);
  if(q.type==='id')wireId();

  if(r.hint)applyHint(true);
  if(r.done)showFinal(false);

}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function wireBuild(q,vb){
  const letters=shuffle([...new Set([vb.a,vb.b,vb.c,'ي','ت','أ','ن','ا','و'])]);
  const marks=[FA,DA,KA,SU];
  const add=(v,idx)=>{if(lockedQ())return;if(idx!==undefined&&U.lockPrefix)idx=Math.max(idx,U.lockPrefix.length);if(idx===undefined)U.tokens.push(v);else U.tokens.splice(idx,0,v);drawAns();};
  const mk=(v,isMark)=>{const b=document.createElement('button');b.className='tile ar'+(isMark?' mark':'');b.textContent=isMark?'◌'+v:v;b.setAttribute('aria-label',isMark?({[FA]:'fatḥa',[DA]:'ḍamma',[KA]:'kasra',[SU]:'sukūn'}[v]):'letter '+v);
    bindTile(b,{zone:'ans'},()=>add(v),(z,x,y)=>add(v,insertIdx(z,x,y)));return b;};
  letters.forEach(v=>$('#letters').appendChild(mk(v,false)));
  marks.forEach(v=>$('#marks').appendChild(mk(v,true)));
  const minLen=()=>U.lockPrefix?U.lockPrefix.length:0;
  $('#undo').onclick=()=>{if(lockedQ()||U.tokens.length<=minLen())return;U.tokens.pop();drawAns();};
  $('#clr').onclick=()=>{if(lockedQ())return;U.tokens=U.lockPrefix?U.lockPrefix.slice():[];drawAns();};
  drawAns();
}
function insertIdx(z,x,y){const chips=[...z.querySelectorAll('.chip')];return chips.filter(c=>{const r=c.getBoundingClientRect();if(r.bottom<y)return true;if(r.top>y)return false;return (r.left+r.right)/2>x;}).length;}
function drawAns(){
  const z=$('#ans');z.innerHTML='';
  U.tokens.forEach((t,i)=>{const isM=[FA,DA,KA,SU].includes(t);const c=document.createElement('button');c.className='chip'+(isM?' mark':'');c.textContent=isM?'◌'+t:t;c.title='Tap to remove';
    c.onclick=()=>{if(lockedQ())return;if(U.lockPrefix&&i<U.lockPrefix.length)return;U.tokens.splice(i,1);drawAns();};z.appendChild(c);});
  $('#prev').textContent=U.tokens.length?LA+' '+U.tokens.join(''):'';
}
function wireId(){
  app.querySelectorAll('.seegbuild select').forEach(sel=>{sel.value=U.sel[sel.dataset.k]||'';sel.onchange=()=>{U.sel[sel.dataset.k]=sel.value;sel.classList.remove('ok','no');};});
}
function wireTr(q){
  const fill=(zone,val)=>{if(lockedQ()||U.lock[zone])return;U.slot[zone]=val;drawSlots(q);};
  q.subj.forEach(id=>{const b=document.createElement('button');b.className='tile en';b.textContent=SM[id].en;b.dataset.v=id;bindTile(b,{zone:'subj'},()=>fill('subj',id),()=>fill('subj',id));$('#subjT').appendChild(b);});
  q.verbs.forEach(v=>{const b=document.createElement('button');b.className='tile en';b.textContent=v;b.dataset.v=v;bindTile(b,{zone:'verb'},()=>fill('verb',v),()=>fill('verb',v));$('#verbT').appendChild(b);});
  ['subj','verb'].forEach(z=>{$('#slot-'+z).onclick=()=>{if(lockedQ()||U.lock[z])return;U.slot[z]=null;drawSlots(q);};});
  drawSlots(q);
}
function drawSlots(){
  const s=U.slot.subj,v=U.slot.verb;
  const ss=$('#slot-subj'),vs=$('#slot-verb');
  ss.textContent=s?SM[s].en:'who?';ss.classList.toggle('filled',!!s);
  vs.textContent=v||'do what?';vs.classList.toggle('filled',!!v);
  app.querySelectorAll('#subjT .tile').forEach(b=>b.classList.toggle('used',+b.dataset.v===s));
  app.querySelectorAll('#verbT .tile').forEach(b=>b.classList.toggle('used',b.dataset.v===v));
}
function lockedQ(){return curRec().done;}

function hint(){
  const r=curRec();if(r.done||r.hint)return;
  r.hint=true;applyHint(false);$('#hintB').disabled=true;if(S.view!=='prac')save();
}
function applyHint(silent){
  const q=QS[curK()],vb=VERBS[q.vi],s=SM[q.sid],fb=$('#fb');
  let msg='';
  if(q.type==='build'){
    const pre=s.id===13&&vb.a==='أ'?['آ']:[s.p,FA];
    U.lockPrefix=pre;if(U.tokens.slice(0,pre.length).join('')!==pre.join(''))U.tokens=pre.concat(U.tokens);drawAns();
    msg='Prefix placed: '+AR(pre.join(''))+'. Ending pattern: '+END_TXT[s.end]+'.';
  } else if(q.type==='id'){
    const sel=app.querySelector('select[data-k=per]');sel.value=s.per;U.sel.per=s.per;sel.disabled=true;
    msg='Person set from the prefix '+AR(s.p+FA)+'.';
  } else {
    U.slot.verb=vb.en;U.lock.verb=true;drawSlots(q);
    msg='Action placed: the root '+AR(vb.madi)+' means “'+vb.en+'”. Voice is active.';
  }
  if(!silent||!curRec().done){fb.className='fb show retry';fb.innerHTML='<div class="h">Hint</div><div class="ex">'+msg+'</div>';}
}

function grade(q,vb,s){
  if(q.type==='build'){
    const stu=norm(U.tokens.join('')),tgt=norm(stem(vb,s));
    if(stu===tgt)return{ok:true};
    let nud;
    if(stu.slice(0,2)!==tgt.slice(0,2))nud='The prefix is wrong.';
    else if(stu.slice(0,7)!==tgt.slice(0,7))nud='Prefix is right. Check the radicals and their vowels: first radical sākin, ʿayn vowel follows '+AR(vb.mud)+'.';
    else nud='The stem is right. Check the ending.';
    return{ok:false,nud};
  }
  const val=validFor(vb,stem(vb,s));
  if(q.type==='id'){
    const u=U.sel;
    if(val.some(x=>x.per===u.per&&x.g===u.g&&x.n===u.n))return{ok:true};
    let bestV=val[0],bm=-1;val.forEach(x=>{const m=['per','g','n'].filter(f=>x[f]===u[f]).length;if(m>bm){bm=m;bestV=x;}});
    const wrong=['per','g','n'].filter(f=>bestV[f]!==u[f]);
    return{ok:false,nud:'Re-check: '+wrong.map(f=>FIELD_EN[f]).join(', ')+'.',wrong};
  }
  const sOk=val.some(x=>x.id===U.slot.subj),vOk=U.slot.verb===vb.en;
  if(sOk&&vOk)return{ok:true};
  return{ok:false,nud:!sOk&&!vOk?'Both the subject and the action are off.':!sOk?'The subject is off — look at the prefix and the ending together.':'The action is off.'};
}
function ready(q){
  if(q.type==='build')return U.tokens.length>0;
  if(q.type==='id')return U.sel.per&&U.sel.g&&U.sel.n;
  return U.slot.subj&&U.slot.verb;
}
function check(){
  const k=curK(),q=QS[k],vb=VERBS[q.vi],s=SM[q.sid],r=curRec(),prac=S.view==='prac';
  if(r.done)return advance();
  if(!ready(q)){$('#qcard').classList.remove('shake');void $('#qcard').offsetWidth;$('#qcard').classList.add('shake');return;}
  const g=grade(q,vb,s);r.tries++;
  const fb=$('#fb');
  if(g.ok){
    r.done=true;r.ok=true;
    if(!prac){
      let pts,label;
      if(r.tries===1){S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);const m=multOf(S.streak);pts=Math.round(BASE[q.type]*m*(r.hint?.5:1));label='+'+pts+(m>1?' ×'+m:'');}
      else{pts=Math.round(BASE[q.type]*.5*(r.hint?.5:1));label='+'+pts;}
      r.pts=pts;S.score+=pts;floatPts(label,$('#checkB'));
      award('first');if(S.streak>=10)award('s10');if(S.streak>=25)award('s25');
      if([3,6,10].includes(S.streak)&&r.tries===1){toast('Streak '+S.streak+' — multiplier ×'+multOf(S.streak));confetti(60);}
    }
    showFinal(true);
  } else if(r.tries>=2){
    r.done=true;r.ok=false;if(!prac)S.streak=0;showFinal(true);
  } else {
    if(!prac)S.streak=0;
    fb.className='fb show retry';fb.innerHTML='<div class="h">✗ Not quite. One more try'+(prac?'':' for half points')+'.</div><div class="ex">'+g.nud+'</div>';
    if(q.type==='id'&&g.wrong)app.querySelectorAll('.seegbuild select').forEach(sel=>{sel.classList.toggle('no',g.wrong.includes(sel.dataset.k));});
    $('#qcard').classList.remove('shake');void $('#qcard').offsetWidth;$('#qcard').classList.add('shake');
  }
  if(!prac){save();renderHUD();}
}
function showFinal(){
  const k=curK(),q=QS[k],vb=VERBS[q.vi],s=SM[q.sid],r=curRec(),fb=$('#fb');
  const val=validFor(vb,stem(vb,s));
  let ans='',ex='';
  if(q.type==='build'){ans=AR(full(vb,s));ex=explain(vb,s);}
  else if(q.type==='id'){
    ans=val.map(x=>AR(seegShort(x))).join('<br>');
    ex=(val.length>1?'This form has '+val.length+' valid readings; any one is accepted. ':'')+explain(vb,s);
    app.querySelectorAll('.seegbuild select').forEach(sel=>{sel.disabled=true;const fit=val.some(x=>x[sel.dataset.k]===sel.value);sel.classList.toggle('ok',r.ok||fit);sel.classList.toggle('no',!r.ok&&!fit);});
  } else {
    ans=val.map(x=>x.en+' must not '+vb.en+'!').join('<br>');
    ex=(val.length>1?'Same form, '+val.length+' valid subjects. ':'')+explain(vb,s)+(vb.pass?' · Active voice, so not “must not '+vb.pass+'”.':'');
  }
  if(r.ok){
    fb.className='fb show ok';
    fb.innerHTML='<div class="h">✓ Correct'+(S.view==='prac'?'':' · +'+r.pts)+'</div>'+(val.length>1&&q.type!=='build'?'<div class="ex">All valid: '+ans.replace(/<br>/g,' · ')+'</div>':'')+'<div class="ex">'+ex+'</div>';
  } else {
    fb.className='fb show no';
    fb.innerHTML='<div class="h">✗ Answer</div><div class="'+(q.type==='tr'?'':'ans')+'">'+ans+'</div><div class="ex">'+ex+'</div>';
  }
  app.querySelectorAll('.tile,#undo,#clr,.slot').forEach(b=>b.disabled=true);
  $('#hintB').disabled=true;
  const cb=$('#checkB');
  if(S.view==='prac')cb.textContent=S.practice.pos+1<S.practice.list.length?'Next →':'Finish practice';
  else{const nx=nextUnanswered(q.sec);cb.textContent=nx===undefined?'Finish section':'Next →';}
  cb.focus();
}
function advance(){
  if(S.view==='prac'){
    S.practice.pos++;
    if(S.practice.pos>=S.practice.list.length){toast('Practice complete');go('final');return;}
    S.practice.rec={done:false,ok:false,tries:0,pts:0,hint:false};go('prac');return;
  }
  const q=QS[S.cur],nx=nextUnanswered(q.sec);
  if(nx===undefined){
    const st=secStats(q.sec);
    if(st.first===st.total)award('sweep'+q.sec);
    if(answered()===QS.length){award('century');if(S.res.every(x=>!x.hint))award('nohint');}
    save();go('sum',q.sec);return;
  }
  go('q',nx);
}

function vSum(){
  const n=S.sumSec,sec=SECS[n-1],st=secStats(n),stars=starsFor(st);
  const nxt=SECS.find(x=>nextUnanswered(x.n)!==undefined);
  app.innerHTML='<div class="card" style="text-align:center"><div class="mini">Section '+n+' complete</div><h1>'+sec.title+' '+AR(sec.ar)+'</h1>'+
   '<div style="font-size:34px">'+starHTML(stars)+'</div><div class="sum-big">+'+st.pts+'</div><div class="mini">points this section</div>'+
   '<div class="sum-grid"><div class="card"><b>'+st.first+'/'+st.total+'</b><span class="mini">first-try correct</span></div><div class="card"><b>'+st.ok+'/'+st.total+'</b><span class="mini">correct overall</span></div><div class="card"><b>'+S.bestStreak+'</b><span class="mini">best streak</span></div></div>'+
   '<div class="row-btns" style="justify-content:center">'+(nxt?'<button class="btn primary" id="nx">Section '+nxt.n+': '+nxt.title+' →</button>':'<button class="btn primary" id="fin">Final results →</button>')+'<button class="btn ghost" id="hm">Sections</button></div></div>';
  if(stars>=2)confetti(140);
  const b=$('#nx');if(b)b.onclick=()=>go('q',nextUnanswered(nxt.n));
  const f=$('#fin');if(f)f.onclick=()=>go('final');
  $('#hm').onclick=()=>go('home');
}
function vFinal(){
  if(S.score>best())store.set(BEST,String(S.score));
  const r=rankOf(S.score),missed=QS.map((q,k)=>k).filter(k=>S.res[k].done&&!(S.res[k].ok&&S.res[k].tries===1));
  const acc=Math.round(S.res.filter(x=>x.ok&&x.tries===1).length/QS.length*100);
  app.innerHTML='<div class="card"><div class="mini">Final results</div><h1>'+r.en+' '+AR(r.ar)+'</h1>'+
   '<div class="sum-big">'+S.score+'<span class="mini" style="font-size:16px"> / '+MAX+' max</span></div>'+
   '<div class="sum-grid"><div class="card"><b>'+acc+'%</b><span class="mini">first-try accuracy</span></div><div class="card"><b>'+S.bestStreak+'</b><span class="mini">best streak</span></div><div class="card"><b>'+S.res.filter(x=>x.hint).length+'</b><span class="mini">hints used</span></div><div class="card"><b>'+best()+'</b><span class="mini">best on this device</span></div></div>'+
   '<table class="rt"><tr><th>Section</th><th>First try</th><th>Correct</th><th>Points</th><th></th></tr>'+SECS.map(sec=>{const st=secStats(sec.n);return '<tr><td>'+sec.title+'</td><td>'+st.first+'/'+st.total+'</td><td>'+st.ok+'/'+st.total+'</td><td>'+st.pts+'</td><td>'+starHTML(starsFor(st))+'</td></tr>';}).join('')+'</table>'+
   '<div class="mini" style="margin-top:14px">Badges</div><div class="badges">'+Object.keys(BADGES).map(id=>'<span class="badge'+(S.badges.includes(id)?'':' off')+'" title="'+BADGES[id].d+'">'+(S.badges.includes(id)?'★ ':'')+BADGES[id].n+'</span>').join('')+'</div>'+
   '<div class="row-btns">'+(missed.length?'<button class="btn primary" id="pr">Practice the '+missed.length+' not right first time</button>':'')+
   '<button class="btn" id="ns">New set of 100</button><button class="btn ghost" id="hm">Sections</button></div></div>';
  const p=$('#pr');if(p)p.onclick=()=>{S.practice={list:shuffle(missed),pos:0,rec:{done:false,ok:false,tries:0,pts:0,hint:false}};go('prac');};
  $('#ns').onclick=()=>{store.del(KEY);fresh((Math.random()*2**31)|0);save();go('home');};
  $('#hm').onclick=()=>go('home');
}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(S.view==='q'||S.view==='prac')&&!(e.target&&e.target.tagName==='SELECT')){const b=$('#checkB');if(b&&document.activeElement&&document.activeElement.classList.contains('tile'))return;if(b){e.preventDefault();b.click();}}});

load();render();
window.__drill={VERBS,SEEG,SM,stem,full,norm,validFor,genSet,get S(){return S;},get QS(){return QS;},get MAX(){return MAX;}};
})();
</script>
