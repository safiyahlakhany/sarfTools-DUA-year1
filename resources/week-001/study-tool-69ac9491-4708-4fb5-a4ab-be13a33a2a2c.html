<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.45), transparent 34%),
        radial-gradient(circle at 80% 75%, rgba(34, 211, 238, 0.35), transparent 32%),
        linear-gradient(135deg, #0f172a, #111827 55%, #172554);
    }

    .card {
      width: min(90vw, 620px);
      padding: clamp(2.5rem, 8vw, 5rem);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 2rem;
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: arrive 700ms ease-out both;
    }

    .eyebrow {
      margin: 0 0 1rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #67e8f9;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.07em;
      background: linear-gradient(120deg, #ffffff, #c4b5fd 45%, #67e8f9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p:last-child {
      max-width: 32rem;
      margin: 1.5rem auto 0;
      line-height: 1.7;
      color: #cbd5e1;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Your first page</p>
    <h1>Hello,<br>world.</h1>
    <p>A tiny page with a little color, a little glow, and a warm welcome.</p>
  </main>
</body>
</html>
